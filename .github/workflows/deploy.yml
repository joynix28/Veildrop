name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject configuration (secrets)
        run: |
          node scripts/configure.mjs \
            --account-id "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            --d1-id "${{ secrets.D1_DATABASE_ID }}" \
            --domains "${{ secrets.DOMAINS }}" \
            --smtp-user "${{ secrets.SENDPULSE_SMTP_USER }}" \
            --smtp-pass "${{ secrets.SENDPULSE_SMTP_PASS }}" \
            --admin-key "${{ secrets.ADMIN_KEYWORD }}" \
            --webhook "${{ secrets.DISCORD_WEBHOOK }}" \
            --operator "${{ secrets.OPERATOR_EMAIL }}"

      - name: Apply database schema
        run: npx wrangler d1 execute veildrop-db --remote --file=./schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deployment failed — check your secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID) in Settings → Secrets and variables → Actions."